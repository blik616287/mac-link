---
# Run on the u26 after the Mac is bootstrapped:  ansible-playbook mac.yml
# Pushes the current exchange/mac-install.sh to the Mac through the tunnel and runs it.
# Stock macOS has no Python, so this only uses the script module, which needs none.
- name: Update the Mac side over the tunnel
  hosts: macs
  gather_facts: false
  tasks:
    - name: Require a rendered installer
      ansible.builtin.assert:
        that: (exchange_dir ~ '/mac-install.sh') is file
        fail_msg: Run u26.yml first.
      delegate_to: localhost

    - name: Re-run the installer on the Mac
      ansible.builtin.script: "{{ exchange_dir }}/mac-install.sh"
      register: install
      changed_when: "'changed:' in install.stdout"

    - name: Result
      ansible.builtin.debug:
        msg: "{{ install.stdout_lines }}"
